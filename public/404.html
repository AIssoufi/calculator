<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <!--
      Cloudflare Pages serves this page, with a 404 status, for every path that matches no file of
      the build. It may answer any depth of path, so it loads nothing with a relative path and keeps
      its styles inline. The Content-Security-Policy of _headers allows the style block below by its
      hash: change the hash there with every edit of the block.
    -->
    <link rel="icon" href="/favicon.ico" />
    <title>Page introuvable | Calculatrice</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background-color: #fff;
        background-image: url('/images/bg.jpg');
        background-repeat: no-repeat;
        background-size: cover;
        color: #222;
        display: flex;
        font-family: 'Roboto', sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 16px;
      }

      main {
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
        max-width: 28rem;
        padding: 32px 24px;
        text-align: center;
        width: 100%;
      }

      .status {
        color: rgb(142, 142, 142);
        font-size: 3rem;
        font-weight: 300;
        margin: 0;
      }

      h1 {
        font-size: 1.5rem;
        margin: 8px 0 16px;
      }

      p {
        line-height: 1.5;
        margin: 0 0 24px;
      }

      a {
        background-color: rgb(245, 146, 62);
        border-radius: 4px;
        color: #000;
        display: inline-block;
        font-weight: 500;
        padding: 12px 20px;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        text-decoration: underline;
      }

      a:focus-visible {
        outline: 3px solid #802d5e;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status" aria-hidden="true">404</p>
      <h1>Page introuvable</h1>
      <p>La page demandée n'existe pas ou a été déplacée.</p>
      <a href="/">Retour à la calculatrice</a>
    </main>
  </body>
</html>
