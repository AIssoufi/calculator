name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a pull request cancels its previous run; every push to master runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Install, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from the packageManager field of package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint the code
        run: pnpm lint

      - name: Check the types
        run: pnpm typecheck

      - name: Run the tests once
        run: pnpm test

      - name: Build the app
        run: pnpm build

      # The cache of the browser is keyed on the Playwright version, which pins its Chromium build.
      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the Chromium of Playwright
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The headless shell is enough for headless tests, and the runner image has its libraries.
      - name: Download the Chromium of Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --only-shell chromium

      - name: Run the smoke tests in Chromium
        run: pnpm test:e2e

  commitlint:
    name: Check the commit messages and the title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Reads the pnpm version from the packageManager field of package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check every commit of the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # A bot such as Dependabot chooses its own titles; its commits are ignored by the
      # configuration.
      - name: Check the title of the pull request
        if: github.event.pull_request.user.type != 'Bot'
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          printf '%s\n' "$PULL_REQUEST_TITLE"
          | pnpm exec commitlint --config scripts/commits/pull-request-title.config.mjs --verbose
