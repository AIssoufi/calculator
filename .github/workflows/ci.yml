name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a pull request cancels its previous run; every push to master runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Install, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the tests once
        run: npm test -- --watchAll=false

      - name: Build the app
        run: npm run build

  commitlint:
    name: Check the commit messages and the title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check every commit of the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # A bot such as Dependabot chooses its own titles; its commits are ignored by the configuration.
      - name: Check the title of the pull request
        if: github.event.pull_request.user.type != 'Bot'
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          printf '%s\n' "$PULL_REQUEST_TITLE"
          | npx --no -- commitlint --config scripts/commits/pull-request-title.config.mjs --verbose
